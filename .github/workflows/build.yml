name: Build

on:
  push:
    branches: ["main"]

  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
